# ── 초기 부트스트랩 전용 HTTP (포트 80) ──────────────────────────
# SSL 인증서 발급 전 Nginx 크래시를 방지하고 Let's Encrypt 검증을 통과하기 위한 설정
server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 챌린지 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 헬스체크 및 API 테스트 프록시
    location /api/health {
        proxy_pass http://server:3000/api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        add_header Content-Type application/json;
        return 200 '{"service":"Sub1S API Gateway (Bootstrap HTTP Mode)","status":"ready_for_ssl"}\n';
    }
}
