<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Sub1S 친구 초대</title>
  <style>
    body { margin: 0; background: #f0f2f5; color: #191f28; font: 1rem system-ui, sans-serif; }
    main { max-width: 28rem; margin: 12vh auto; padding: 1.75rem; box-sizing: border-box; }
    h1 { font-size: 1.65rem; margin: 0 0 .75rem; }
    p { line-height: 1.6; }
    a { color: #002968; }
    #open-app { display: inline-block; padding: .85rem 1.25rem; border-radius: .75rem; background: #002968; color: white; font-weight: 700; text-decoration: none; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Sub1S 친구 초대</h1>
    <p id="message">초대 링크를 확인하고 있어요.</p>
    <a id="open-app" hidden>Sub1S에서 열기</a>
    <p id="help" hidden>앱이 열리지 않으면 기본 브라우저에서 이 링크를 열어 보세요.</p>
    <p><a href="https://github.com/z1zone-team/sub1s-app/releases/latest">Android 앱 받기</a></p>
    <noscript>브라우저에서 JavaScript를 켠 뒤 다시 열어 주세요.</noscript>
  </main>
  <script>
    const invite = /^\/invite\/([A-Za-z0-9_-]{16})\/?$/.exec(location.pathname);
    const message = document.getElementById("message");
    if (invite) {
      const button = document.getElementById("open-app");
      button.href = "sub1s://invite/" + invite[1];
      button.hidden = false;
      document.getElementById("help").hidden = false;
      message.textContent = "친구 초대를 수락하려면 앱을 열어 주세요.";
    } else {
      message.textContent = "초대 링크 형식이 올바르지 않아요. 친구에게 링크를 다시 받아 주세요.";
    }
  </script>
</body>
</html>
