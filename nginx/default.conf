# ── HTTP (포트 80) ──────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 챌린지 경로 (인증서 갱신 시 필수)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 나머지 모든 HTTP 요청은 HTTPS로 영구 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS (포트 443) ─────────────────────────────────────────
server {
    listen 443 ssl;
    server_name _;

    # Let's Encrypt 인증서 마운트 경로
    # (도메인 발급 전에는 init-letsencrypt.sh 실행 필요)
    ssl_certificate     /etc/letsencrypt/live/sub1s.devnoco.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sub1s.devnoco.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # 보안 헤더
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Android 개발 앱의 HTTPS 초대 링크 연결 파일
    location = /.well-known/assetlinks.json {
        root /usr/share/nginx/html;
        types { }
        default_type application/json;
        try_files $uri =404;
    }

    # 1. Socket.io 실시간 WebSocket. 엔진 경로는 기본값 /socket.io/ 이고 /ws/subway 는 네임스페이스라서
    #    클라이언트는 wss://도메인/ws/subway 로 접속해도 실제 요청은 이 경로로 온다
    location /socket.io/ {
        proxy_pass http://server:3000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 롱폴링/스트림 유지 시간 (24시간)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # 2. 백엔드 시스템 헬스체크 (/api/health)
    location = /api/health {
        proxy_pass http://server:3000/api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Swagger OpenAPI 문서 (/api/docs)
    location /api/docs {
        proxy_pass http://server:3000/api/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. 코어 REST API 엔드포인트 (/api/v1/)
    location /api/v1/ {
        limit_req zone=anon_api burst=50 nodelay;
        limit_req zone=api_ip burst=200 nodelay;

        proxy_pass http://server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # 4-1. 지도의 열차 위치는 mock 서버(server-mock)가 답한다. 서울시 API 호출 예산은 server 컨테이너가 수집에 쓴다.
    #      주소를 요청 때 해석해서 server-mock이 내려가 있어도 nginx는 뜨고, 그때는 502만 난다
    location = /api/v1/trains/positions {
        limit_req zone=anon_api burst=50 nodelay;
        limit_req zone=api_ip burst=200 nodelay;

        resolver 127.0.0.11 valid=10s;
        set $mock_upstream http://server-mock:3000;
        proxy_pass $mock_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 10s;
        proxy_connect_timeout 3s;
    }

    # 5. 기타 /api/ 요청 프록시
    location /api/ {
        proxy_pass http://server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 6. 루트 접속 상태 브리핑
    location / {
        add_header Content-Type application/json;
        return 200 '{"service":"Sub1S API Gateway","status":"online","version":"1.0.0"}\n';
    }
}
