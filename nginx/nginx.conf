user  nginx;
worker_processes  auto;

# 컨테이너 파일 디스크립터 한도 상향 (동시 웹소켓 및 프록시 연결 지원)
worker_rlimit_nofile 16384;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  8192;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # 인증 헤더 유무에 따른 Rate Limiting 매핑
    map $http_authorization $anon_api {
        default "";
        ""      $binary_remote_addr;
    }

    # 비인증 API 요청 및 일반 요청 속도 제한
    limit_req_zone $anon_api zone=anon_api:10m rate=30r/s;
    # Authorization 헤더는 누구나 붙일 수 있어서(검증은 서버가 한다) 헤더와 상관없이 IP당 전체 요청 수를 따로 제한한다
    limit_req_zone $binary_remote_addr zone=api_ip:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_status 429;

    # 음성 녹음 오디오(m4a/wav) 업로드 지원 (최대 10MB)
    client_max_body_size 10M;

    sendfile        on;
    keepalive_timeout  65;

    # JSON 및 텍스트 응답 Gzip 압축
    gzip on;
    gzip_types text/plain application/json application/javascript text/css application/xml;
    gzip_min_length 1024;

    include /etc/nginx/conf.d/*.conf;
}
