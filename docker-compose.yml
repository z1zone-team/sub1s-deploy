name: sub1s

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # 1. 메인 관계형 & 벡터 데이터베이스 (768MB 상한 / 256MB 예약)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sub1s-postgres
    restart: unless-stopped
    logging: *default-logging
    command: postgres -c shared_buffers=128MB
    environment:
      POSTGRES_DB: sub1s_db
      POSTGRES_USER: sub1s_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required (see .env.example)}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sub1s_user -d sub1s_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 768M
        reservations:
          memory: 256M
    networks:
      - sub1s-network

  # 2. 인메모리 캐시 & BullMQ 큐 브로커 (128MB 상한 / 32MB 예약)
  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: sub1s-valkey
    restart: unless-stopped
    logging: *default-logging
    command: valkey-server --maxmemory 80mb --maxmemory-policy noeviction --appendonly yes
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M
        reservations:
          memory: 32M
    networks:
      - sub1s-network

  # 3. 코어 백엔드 API & 다익스트라 엔진 & WebSocket 게이트웨이 (768MB 상한 / 256MB 예약)
  server:
    image: ${SERVER_IMAGE:-ghcr.io/z1zone-team/sub1s-server:latest}
    container_name: sub1s-server
    restart: unless-stopped
    logging: *default-logging
    command: ["node", "dist/main"]
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=512"
      PORT: 3000
      DATABASE_URL: postgresql://sub1s_user:${DB_PASSWORD}@postgres:5432/sub1s_db?schema=public
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
      AI_SERVICE_URL: http://ai:8000
      # 도보 구간을 실제 보행로로 구하는 OSRM 주소. 응답이 없으면 서버가 알아서 직선 추정으로 돌아간다
      OSRM_URL: ${OSRM_URL:-http://osrm:5000}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLIENT_KEY: ${CLIENT_KEY}
      MASTER_3DES_KEY: ${MASTER_3DES_KEY:-${MASTER_ENCRYPTION_KEY}}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-${MASTER_3DES_KEY}}
      ROUTING_ENGINE: ${ROUTING_ENGINE:-DIJKSTRA}
      # sub1s.env(OCI 버킷)에 넣은 외부 서비스 키를 서버 컨테이너로 전달한다. 값이 없으면 빈 문자열이고 서버는 해당 기능만 끈다
      VWORLD_API_KEY: ${VWORLD_API_KEY:-}
      VWORLD_DAILY_LIMIT: ${VWORLD_DAILY_LIMIT:-}
      VWORLD_PROXY_URL: ${VWORLD_PROXY_URL:-}
      VWORLD_PROXY_SECRET: ${VWORLD_PROXY_SECRET:-}
      SEOUL_SUBWAY_REALTIME_API_KEY: ${SEOUL_SUBWAY_REALTIME_API_KEY:-}
      SEOUL_OPEN_API_KEY: ${SEOUL_OPEN_API_KEY:-}
      # 서울시 열차 위치 폴링. 비워 두면 꺼진 상태다. 켜려면 TRAIN_POSITION_ENABLED=true (키는 SEOUL_SUBWAY_REALTIME_API_KEY를 같이 쓴다)
      TRAIN_POSITION_ENABLED: ${TRAIN_POSITION_ENABLED:-}
      TRAIN_POSITION_LINES: ${TRAIN_POSITION_LINES:-}
      TRAIN_POSITION_DAILY_BUDGET: ${TRAIN_POSITION_DAILY_BUDGET:-}
      TRAIN_POSITION_INTERVAL_SEC: ${TRAIN_POSITION_INTERVAL_SEC:-}
      PUBLIC_DATA_API_KEY: ${PUBLIC_DATA_API_KEY:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      DATA_ALERT_WEBHOOK_URL: ${DATA_ALERT_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 768M
        reservations:
          memory: 256M
    networks:
      - sub1s-network

  # 4. AI 워커 서비스 (Faster-Whisper int8, Gemini NLU) (1024MB 상한 / 512MB 예약)
  ai:
    image: ${AI_IMAGE:-ghcr.io/z1zone-team/sub1s-ai:latest}
    container_name: sub1s-ai
    restart: unless-stopped
    logging: *default-logging
    environment:
      PORT: 8000
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ENABLE_BULLMQ_WORKER: "true"
      DEBUG: "false"
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          cpus: '0.60'
          memory: 1024M
        reservations:
          memory: 512M
    networks:
      - sub1s-network

  # 5. Nginx 리버스 프록시, SSL 종단, WebSocket 및 Rate Limiting (64MB 상한 / 16MB 예약)
  nginx:
    image: nginx:1.27-alpine
    container_name: sub1s-nginx
    restart: unless-stopped
    logging: *default-logging
    command:
      - /bin/sh
      - -c
      - "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"
    depends_on:
      server:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/assetlinks.json:/usr/share/nginx/html/.well-known/assetlinks.json:ro
      - ./nginx/invite.html:/usr/share/nginx/html/invite.html:ro
      - ./nginx/${NGINX_CONF:-default.conf}:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M
        reservations:
          memory: 16M
    networks:
      - sub1s-network

  # 6. Let's Encrypt 인증서 자동 갱신 데몬
  certbot:
    image: certbot/certbot:latest
    container_name: sub1s-certbot
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;"
    networks:
      - sub1s-network

  # 7. 보행 경로 길찾기(OSRM, OSM 한국 데이터의 foot 프로필) (2560MB 상한 / 256MB 예약)
  #    데이터는 `osrm/prepare.sh`로 한 번 만든다(README 참고). 데이터가 없으면 안내만 남기고 대기하며, 그동안 서버는 직선 추정을 쓴다.
  #    이미지는 태그에 버전이 없어 다이제스트로 고정했고, 데이터를 만든 이미지와 같아야 한다(prepare.sh의 OSRM_IMAGE)
  osrm:
    image: ${OSRM_IMAGE:-ghcr.io/project-osrm/osrm-backend@sha256:55dbfd47d984c2cacd64e32901b4321c86b5ec761438e69aa053dc78698a786f}
    container_name: sub1s-osrm
    restart: unless-stopped
    logging: *default-logging
    command:
      - /bin/sh
      - -c
      - |
        if [ -f /data/south-korea.osrm.mldgr ]; then
          exec osrm-routed --algorithm mld --max-table-size 100 /data/south-korea.osrm
        fi
        echo "OSRM 보행 데이터가 없습니다. README의 'OSRM 보행 경로 데이터 준비'를 먼저 실행하세요"
        sleep infinity
    volumes:
      - osrm_data:/data:ro
    expose:
      - "5000"
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 2560M
        reservations:
          memory: 256M
    networks:
      - sub1s-network

  # 8. 열차 위치 mock 서버. 지도에 보이는 열차(/api/v1/trains/positions)만 가짜 열차로 답한다.
  #    서울시 실시간 API는 키 하나에 하루 1,000회라 server 컨테이너가 시간표를 메우는 수집에 쓰고, 이 컨테이너는 서울시 키를 받지 않는다.
  #    같은 이미지지만 정산 스케줄러(PUSH_SCHEDULER_ENABLED=false)와 음성 작업 처리기(VALKEY_HOST 없음)는 꺼 둔다.
  #    서버는 시작할 때 DB에 연결하므로 DATABASE_URL은 필요하다(이 컨테이너는 DB에 쓰지 않는다)
  server-mock:
    image: ${SERVER_IMAGE:-ghcr.io/z1zone-team/sub1s-server:latest}
    container_name: sub1s-server-mock
    restart: unless-stopped
    logging: *default-logging
    command: ["node", "dist/main"]
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=256"
      PORT: 3000
      DATABASE_URL: postgresql://sub1s_user:${DB_PASSWORD}@postgres:5432/sub1s_db?schema=public
      MASTER_3DES_KEY: ${MASTER_3DES_KEY:-${MASTER_ENCRYPTION_KEY}}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-${MASTER_3DES_KEY}}
      PUSH_SCHEDULER_ENABLED: "false"
      TRAIN_POSITION_SOURCE: MOCK
      TRAIN_POSITION_ENABLED: "true"
      TRAIN_POSITION_LINES: ${MOCK_TRAIN_POSITION_LINES:-01,02,03,04,05,06,07,08,09}
      # 가짜 열차는 호출이 없어 짧게 돌려도 된다. 호선을 하나씩 돌며 갱신하므로 호선 수 x 이 값이 한 호선의 갱신 주기다
      TRAIN_POSITION_INTERVAL_SEC: ${MOCK_TRAIN_POSITION_INTERVAL_SEC:-3}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 384M
        reservations:
          memory: 128M
    networks:
      - sub1s-network

networks:
  sub1s-network:
    driver: bridge

volumes:
  pg_data:
  valkey_data:
  osrm_data:
  certbot-www:
  certbot-conf:
